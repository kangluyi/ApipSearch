# VitePress 部署到 GitHub Pages 的工作流
name: Deploy VitePress site to Pages

on:
  # 推送到 main 分支时触发
  push:
    branches: ["main"]
  
  # 允许手动触发
  workflow_dispatch:

# 设置权限
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制，防止同时部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，用于最后更新时间等特性
      
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'  # 如果使用 pnpm 或 yarn，这里需要调整
      
      - name: 安装依赖
        run: npm ci  # 或 yarn install --frozen-lockfile, pnpm install --frozen-lockfile
      
      - name: 构建 VitePress 站点
        run: npm run docs:build  # 根据你的 package.json 脚本调整
      
      - name: 添加 .nojekyll 文件
        # GitHub Pages 默认使用 Jekyll，这个文件可以让它不处理你的文件
        run: touch docs/.vitepress/dist/.nojekyll
      
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist  # VitePress 默认输出目录

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
