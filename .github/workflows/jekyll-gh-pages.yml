# .github/workflows/deploy-vitepress.yml
name: Deploy VitePress site to GitHub Pages

on:
  # 推送到 main 分支时触发
  push:
    branches: ["main"]
  
  # 允许手动触发
  workflow_dispatch:

# 设置 GitHub Pages 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'  # 如果使用 yarn 或 pnpm，相应调整
      
      - name: Install dependencies
        run: npm ci  # 或 yarn install --frozen-lockfile
      
      - name: Build VitePress site
        run: npm run docs:build  # 根据你的 package.json 脚本调整
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist  # VitePress 默认构建输出目录

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
